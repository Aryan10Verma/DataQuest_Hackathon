# Keeps the Render backend awake. Render's free plan puts a service to sleep after 15 minutes without
# visitors, and the next visitor then waits about a minute for it to start. A health check every
# 5 minutes stops that. Render's free plan allows 750 instance hours a month, enough for one service
# running all month; delete this file to let the backend sleep again.
name: Keep backend awake

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping the health check
        run: |
          # A sleeping service can take up to a minute to answer, so allow 90 seconds and retry twice.
          curl --silent --show-error --fail --max-time 90 --retry 2 --retry-delay 10 \
            https://prismav.onrender.com/api/v1/system/health
